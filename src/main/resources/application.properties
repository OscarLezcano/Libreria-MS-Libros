# cSpell:disable

# Imports
spring.config.import=classpath:config/private.properties

# Configuraciones de la aplicacion
# Ojo: el nombre debe ir en minusculas para que el gateway resuelva lb://stock-service
spring.application.name=stock-service
server.port=8083
# Prefijo alineado con la ruta del gateway (/stock/**) y headers del gateway para OpenAPI
server.servlet.context-path=/stock
server.forward-headers-strategy=framework

# Eureka (descubrimiento dinamico)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Swagger (creo)
springdoc.api-docs.enabled=true

# Pagination (tamaño por defecto y máximo de página)
app.pagination.page-size=25
app.pagination.max-page-size=100

# Base de datos
spring.datasource.url=${db.url}?user=${db.username}&password=${db.password}

# Jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Liquibase (el esquema se administra desde la libreria comun)
spring.liquibase.enabled=false

# Logs
logging.file.name=app.log
logging.level.com.bigobooks=ERROR
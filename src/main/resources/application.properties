# cSpell:disable

# Imports
spring.config.import=classpath:config/private.properties

# Configuraciones de la aplicacion
# NOTA: el nombre debe ir en minusculas para que el gateway resuelva lb://stock-service
spring.application.name=stock-service
server.port=8083

server.servlet.context-path=/stock
server.forward-headers-strategy=framework

# Eureka (descubrimiento dinamico)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Swagger (creo)
springdoc.api-docs.enabled=true

# Pagination (tamaño por defecto y máximo de página)
app.pagination.page-size=25
app.pagination.max-page-size=100

# Base de datos
spring.datasource.url=${db.url}?user=${db.username}&password=${db.password}

# Configuracion de Redis
spring.cache.type=redis
spring.data.redis.url=${redis.url}

# Configuracion de ttl
spring.cache.redis.time-to-live=600000 

# Jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Liquibase (el esquema se administra desde la libreria comun)
spring.liquibase.enabled=false

# Logs
logging.file.name=app.log
logging.level.com.bigobooks=INFO
logging.level.com.bigobooks.controller=INFO
logging.level.com.bigobooks.services=DEBUG
logging.level.com.bigobooks.repositories=DEBUG
logging.logback.rollingpolicy.max-file-size=10MB

# Supuestamente asi se configura Hibernate para los logs
logging.level.org.hibernate.SQL=DEBUG

logging.pattern.file=%d{dd-MM-yyyy HH:mm:ss} %level [%X{traceId}] %logger - %msg%n
logging.pattern.console=%d{HH:mm:ss} %level [%X{traceId}] %logger - %msg%n
# cSpell:disable

# Imports
spring.config.import=classpath:config/private.properties

# Configuraciones de la aplicacion
spring.application.name=BigoBooksStock
server.port=${STOCK_SERVER_PORT:8082}

# Swagger (creo)
springdoc.api-docs.enabled=true

# Pagination (tamaño por defecto y máximo de página)
app.pagination.page-size=25
app.pagination.max-page-size=100

# Base de datos
spring.datasource.url=${db.url}?user=${db.username}&password=${db.password}

# Jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Liquibase (el esquema se administra desde la libreria comun)
spring.liquibase.enabled=false

# Logs
logging.file.name=app.log
logging.level.com.bigobooks=ERROR
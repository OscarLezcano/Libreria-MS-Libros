# cSpell:disable
openapi: 3.0.3
info:
  title: BigoBooks Stock API
  version: 1.0.0
paths:
  /books:
    get:
      tags:
        - Books
      operationId: getBooks
      parameters:
        - name: title
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Books found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
    post:
      tags:
        - Books
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookDto'
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /books/{id}:
    get:
      tags:
        - Books
      operationId: getBookById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: Book not found
    put:
      tags:
        - Books
      operationId: updateBook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookDto'
      responses:
        '200':
          description: Book updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: Book not found
    delete:
      tags:
        - Books
      operationId: deleteBook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Book deleted
  /books/genre/{genreId}:
    get:
      tags:
        - Books
      operationId: getBooksByGenre
      parameters:
        - name: genreId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Books found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /books/author/{authorId}:
    get:
      tags:
        - Books
      operationId: getBooksByAuthor
      parameters:
        - name: authorId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Books found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /genres:
    get:
      tags:
        - Genres
      operationId: getGenres
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Genres found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
    post:
      tags:
        - Genres
      operationId: createGenre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenreDto'
      responses:
        '201':
          description: Genre created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /genres/{id}:
    get:
      tags:
        - Genres
      operationId: getGenreById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Genre found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: Genre not found
    put:
      tags:
        - Genres
      operationId: updateGenre
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenreDto'
      responses:
        '200':
          description: Genre updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: Genre not found
    delete:
      tags:
        - Genres
      operationId: deleteGenre
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Genre deleted
  /authors:
    get:
      tags:
        - Authors
      operationId: getAuthors
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Authors found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
    post:
      tags:
        - Authors
      operationId: createAuthor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorDto'
      responses:
        '201':
          description: Author created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /authors/{id}:
    get:
      tags:
        - Authors
      operationId: getAuthorById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Author found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: Author not found
    put:
      tags:
        - Authors
      operationId: updateAuthor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorDto'
      responses:
        '200':
          description: Author updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: Author not found
    delete:
      tags:
        - Authors
      operationId: deleteAuthor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Author deleted
  /warehouses:
    get:
      tags:
        - Warehouses
      operationId: getWarehouses
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Warehouses found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
    post:
      tags:
        - Warehouses
      operationId: createWarehouse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseDto'
      responses:
        '201':
          description: Warehouse created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /warehouses/{id}:
    get:
      tags:
        - Warehouses
      operationId: getWarehouseById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Warehouse found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: Warehouse not found
    put:
      tags:
        - Warehouses
      operationId: updateWarehouse
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseDto'
      responses:
        '200':
          description: Warehouse updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: Warehouse not found
    delete:
      tags:
        - Warehouses
      operationId: deleteWarehouse
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Warehouse deleted
  /stocks/warehouse/{warehouseId}:
    get:
      tags:
        - Stocks
      operationId: getStocksByWarehouse
      parameters:
        - name: warehouseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Stocks found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /stocks/book/{bookId}:
    get:
      tags:
        - Stocks
      operationId: getStocksByBook
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Stocks found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /stocks/warehouse/{warehouseId}/book/{bookId}:
    get:
      tags:
        - Stocks
      operationId: getStock
      parameters:
        - name: warehouseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Stock found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: Stock not found
    post:
      tags:
        - Stocks
      operationId: setStockQuantity
      description: Adds quantity to the stock (negative values subtract)
      parameters:
        - name: warehouseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockQuantityRequestDto'
      responses:
        '200':
          description: Stock set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: Warehouse not found
  /stock-adjustments/{id}:
    get:
      tags:
        - StockAdjustments
      operationId: getStockAdjustmentById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Stock adjustment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: Stock adjustment not found
  /stock-adjustments/warehouse/{warehouseId}:
    get:
      tags:
        - StockAdjustments
      operationId: getStockAdjustmentsByWarehouse
      parameters:
        - name: warehouseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Stock adjustments found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
    post:
      tags:
        - StockAdjustments
      operationId: createStockAdjustment
      parameters:
        - name: warehouseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentDto'
      responses:
        '201':
          description: Stock adjustment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          description: Invalid stock adjustment
components:
  schemas:
    BookDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        coverUrl:
          type: string
          example: 'https://covers.example.com/9789876543210.jpg'
        title:
          type: string
          example: El Principito
        description:
          type: string
          example: Un aviador cae en el desierto del Sahara y conoce a un pequeño príncipe.
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00'
        genreIds:
          type: array
          items:
            type: integer
            format: int64
          example:
            - 1
        authorIds:
          type: array
          items:
            type: integer
            format: int64
          example:
            - 1
    GenreDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Fantasía
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00'
    AuthorDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Gabriel García Márquez
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00'
    WarehouseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Central Asunción
        address:
          type: string
          example: Av. España 1234
        city:
          type: string
          example: Asunción
        phone:
          type: string
          example: '+595 21 1234567'
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00'
    StockDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        quantity:
          type: integer
          example: 25
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00'
        warehouse:
          allOf:
            - $ref: '#/components/schemas/WarehouseDto'
          example:
            id: 1
            name: Central Asunción
            city: Asunción
    StockAdjustmentDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        note:
          type: string
          example: Conteo físico mensual
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00'
        details:
          type: array
          items:
            $ref: '#/components/schemas/StockAdjustmentDetailDto'
          example:
            - id: 1
              book: 1
              bookName: El Principito
              systemQuantity: 24
              physicalQuantity: 25
    StockAdjustmentDetailDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        book:
          type: integer
          format: int64
          example: 1
        bookName:
          type: string
          example: El Principito
        systemQuantity:
          type: integer
          example: 24
        physicalQuantity:
          type: integer
          example: 25
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00'
    StockQuantityRequestDto:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          example: 10
    Pagination:
      type: object
      properties:
        page:
          type: integer
          format: int32
          example: 0
        size:
          type: integer
          format: int32
          example: 25
        totalElements:
          type: integer
          format: int64
          example: 103
        totalPages:
          type: integer
          format: int32
          example: 5
    Envelope:
      type: object
      properties:
        data:
          type: object
        pagination:
          $ref: '#/components/schemas/Pagination'
